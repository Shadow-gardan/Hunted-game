<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1{
            font-size: 9.5rem;
            font-weight: 800;
            font-family: 'Times New Roman', Times, serif;
            font-style: oblique;
            padding: 1rem;
            margin-top: 300px;
            color: #fff;
            background: linear-gradient(130deg,red,blue,rgb(126, 19, 232),black);
            border-radius: 100px;
            transition: 0.3s;
            transform: rotateX(180deg);
        }
        h1:hover{
            transform: rotateX(0deg);
            transition-duration: 1.3s;
            font-size: 11rem;
            padding: 0;
            transform-style: preserve-3d;
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
</head>
<body>
    <h1>
        good morning
    </h1>
</body>
</html>
